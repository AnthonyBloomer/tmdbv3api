name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .

      - name: Run tests
        # Tests that hit the live TMDb API skip themselves when TMDB_API_KEY is
        # unset, so this job covers the offline suite on forks and pull
        # requests, and the full suite wherever the secrets are available.
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_SESSION_ID: ${{ secrets.TMDB_SESSION_ID }}
        run: python -m unittest discover -v tests/
